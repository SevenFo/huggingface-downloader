name: Publish Python Package to PyPI

on:
  push:
    tags:
      - 'v*' # 只在 v* 标签时触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi # 环境名称改为 pypi，用于控制正式发布
      url: https://pypi.org/p/siky-hfd
    permissions:
      # id-token: write # 如果 PyPI 使用 OIDC，则需要
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    # 移除发布到 TestPyPI 的步骤

    - name: Publish package to PyPI
      # 只发布到正式 PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # 使用正式 PyPI 的 API Token
        password: ${{ secrets.PYPI_API_TOKEN }}
        # repository_url 默认为 https://upload.pypi.org/legacy/

